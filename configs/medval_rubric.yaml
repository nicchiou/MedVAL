# MedVAL rubric (risk_level: 1=safe -> 4=dangerous) on the local MedVAL-Bench CSV.
# Run from external/MedVAL/:  python run.py --config medval_rubric
# Output: {output_dir}/{method}/medval/{model}/medval_bench.csv
tasks: [report2impression, impression2simplified, dialogue2note, bhc2spanish, query2question, medication2answer]
data: test
method: zero-shot
validator_type: medval

n_samples: null
debug: False
input_csv: /lfs/skampere1/0/judge-reliability/data/samples/clinical_summ/medval_bench.csv
output_dir: /lfs/skampere1/0/judge-reliability/results/medval

n_runs: 3             # independent inference runs per item (stored long, `run` column)
retry_failed: False   # True: re-run only (#, run) rows with a missing score in an existing output CSV
max_retries: 2

model: openai/gpt-5.5   # also: openai/claude-sonnet-5, openai/Llama-4
api_base: https://aiapi-prod.stanford.edu/v1
api_key: ${STANFORD_API_KEY}
temperature: 1.0        # API default; gpt-5.5 rejects 0.0. Same for all models for comparability
max_tokens: 4000          # 1000 truncates claude-sonnet-5 (finish_reason=length); reasoning tokens count too
local_model_path: null
